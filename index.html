<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Close Call</title>
    <meta name="description" content="A daily guessing game: name the mystery animal from a photo taken way too close. Each wrong guess zooms out." />
    <meta name="theme-color" content="#eff1f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e11" media="(prefers-color-scheme: dark)" />
    <!-- Link previews: name a spoiler-free card, or crawlers grab today's photo off the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Close Call" />
    <meta property="og:title" content="Close Call" />
    <meta property="og:description" content="A daily guessing game: name the mystery animal from a photo taken way too close." />
    <meta property="og:url" content="https://closecall.jonstuebe.com/" />
    <meta property="og:image" content="https://closecall.jonstuebe.com/icons/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Close Call magnifier and wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Close Call" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('closecall:v1') || '{}').settings || {};
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        if (s.highContrast) document.documentElement.dataset.contrast = 'high';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Close Call needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
